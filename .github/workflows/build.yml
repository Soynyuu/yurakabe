name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version
      - name: Contract and import tests
        run: ./scripts/test.sh
      - name: Build and verify local signature
        run: ./scripts/build.sh
      - name: Package development build
        run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Release/Yurakabe.app build/Yurakabe.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Yurakabe-development
          path: build/Yurakabe.zip
          retention-days: 7
